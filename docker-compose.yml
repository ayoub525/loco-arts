version: '3.8'

services:
  # Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: loco_arts_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-loco_arts}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Express API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: loco_arts_server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-loco_arts}?schema=public
      JWT_SECRET: ${JWT_SECRET:-loco-arts-super-secret-production-jwt-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-loco-arts-super-refresh-key}
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      NODE_ENV: production
      UPLOAD_DIR: uploads
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads

  # Frontend React (Vite + Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: loco_arts_client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  postgres_data:
  uploads_data:
